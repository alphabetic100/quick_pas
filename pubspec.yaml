name: quick_pass
description: "A Password Manager App for Android and iOS"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter

  # flutter packages

  # cupertion icons
  cupertino_icons: ^1.0.8
  # Secure storage for store sensitive data
  flutter_secure_storage: ^9.2.4
  # State management
  flutter_riverpod: ^2.6.1
  # Routing
  go_router: ^15.2.3
  # Fonts Libreary
  google_fonts: ^6.2.1
  #Pick Image
  image_picker: ^1.1.2
  #Database --> Supabase
  supabase_flutter: ^2.9.1
  #Biometric Authentication
  local_auth: ^2.3.0
  shimmer: ^3.0.0
  # Local Database for offline support
  sqflite: ^2.3.3+1
  # Connectivity checking
  connectivity_plus: ^6.0.5
  # Path provider for database location
  path: ^1.9.0
  # Path provider for getting app directories
  path_provider: ^2.1.4
  # HTTP client for image downloading
  http: ^1.2.2
  # Toast notifications
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1


flutter:


  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/



  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

# Flutter Native Splash Configuration
flutter_native_splash:
  color: "#ffffff"
  image: assets/logos/app_logo.png
  color_dark: "#121212"
  image_dark: assets/logos/app_logo.png
  android_12:
    image: assets/logos/app_logo.png
    color: "#ffffff"
    image_dark: assets/logos/app_logo.png
    color_dark: "#121212"
  web: false

# Flutter Launcher Icons Configuration
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logos/app_logo.png"
  

